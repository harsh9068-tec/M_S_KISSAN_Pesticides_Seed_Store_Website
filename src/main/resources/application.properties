# ============================================================================
# M/S KISSAN PESTICIDES & SEED STORE - SPRING BOOT CONFIGURATION
# ============================================================================

server.port=${PORT:8080}

# Application Details
spring.application.name=kissan-pesticides-seed-store

# Embedded Persistent SQL Database Configuration
spring.datasource.url=jdbc:h2:file:./data/kissan_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate SQL Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Disabled by default for security in production; toggle with H2_CONSOLE_ENABLED=true)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# File Upload Multipart Limit
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Static Resources Mapping (Restricted to safe classpath and static directories; root directory omitted)
spring.web.resources.static-locations=classpath:/static/,file:/app/static/,file:./static/

# Razorpay Online Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_kissanstore}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:kissan_secret_demo_key}
razorpay.currency=INR
razorpay.company.name=M/S KISSAN Pesticides & Seed Store
