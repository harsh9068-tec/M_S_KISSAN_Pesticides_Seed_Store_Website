# ============================================================================
# M/S KISSAN PESTICIDES & SEED STORE - SPRING BOOT CONFIGURATION
# ============================================================================

server.port=8080

# Application Details
spring.application.name=kissan-pesticides-seed-store

# Embedded Persistent SQL Database Configuration
spring.datasource.url=jdbc:h2:file:./data/kissan_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate SQL Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Multipart Limit
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Static Resources Mapping
spring.web.resources.static-locations=classpath:/static/,file:./
